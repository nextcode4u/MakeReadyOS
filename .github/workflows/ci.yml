name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install system test tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint GitHub workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix apps/api ci

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Audit root production dependencies
        run: npm audit --omit=dev

      - name: Audit API production dependencies
        run: npm --prefix apps/api audit --omit=dev

      - name: Audit web production dependencies
        run: npm --prefix apps/web audit --omit=dev

      - name: Run build script
        run: ./build.sh

      - name: Run test script
        run: ./test.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: logs/
          if-no-files-found: ignore
